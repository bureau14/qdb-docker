version: 0.2

phases:
  pre_build:
    commands:
      # CodeBuild injects this value from SSM Parameter Store; printf feeds only
      # Docker's stdin and does not write the token to the build log.
      - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  build:
    commands:
      - ./consolidate-manifest.sh
